plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Possible Triangle"
        url = "https://registry.somethingcatchy.net/repository/maven-public"
        content {
            includeGroup("com.possible-triangle")  // for Oreganized multikulti datagen
        }
    }
    maven { url = "https://packages.aether-mod.net/Nitrogen" }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll([
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'bountifulfares',
                    '--existing-mod', 'nomansland',
                    '--existing-mod', 'caverns_and_chasms',
                    '--existing-mod', 'buzzier_bees',
                    '--existing-mod', 'autumnity'
            ] as List<String>)  // to avoid annoying purple underline
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    runtimeOnly "maven.modrinth:jei:${jei_version}"
    runtimeOnly "maven.modrinth:emi:${emi_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    implementation "maven.modrinth:moonlight:${moonlight_lib_version}"
    implementation "maven.modrinth:every-compat:${every_compat_version}"

    implementation "maven.modrinth:nexuslib:${nexuslib_version}"
    implementation "maven.modrinth:bountiful-fares:${bountiful_fares_version}"

    implementation "maven.modrinth:biolith:${biolith_version}"
    implementation "maven.modrinth:no-mans-land:${nml_version}"
    implementation "maven.modrinth:mixed-litter:${mixed_litter_version}"

    implementation "maven.modrinth:owo-lib:${owolib_version}"
    implementation "com.aetherteam.nitrogen:nitrogen_internals:${nitrogen_version}"
    implementation "maven.modrinth:accessories:${accessories_version}"
    implementation "maven.modrinth:aether:${aether_version}"

    implementation "maven.modrinth:blueprint:${blueprint_version}"
    implementation "maven.modrinth:environmental:${environmental_version}"
    implementation "maven.modrinth:incubation:${incubation_version}"
    implementation "maven.modrinth:eIO12l2t:${allurement_version}"
    implementation "maven.modrinth:caverns-and-chasms:${cnc_version}"
    implementation "maven.modrinth:gallery:${gallery_version}"
    implementation "maven.modrinth:autumnity:${autumnity_version}"
    implementation "maven.modrinth:buzzier-bees:${buzzier_bees_version}"

    implementation "com.possible-triangle:multikulti-datagen-neoforge:${multikulti_version}"
    implementation "maven.modrinth:oreganized:${oreganized_version}"

    implementation "maven.modrinth:geckolib:${geckolib_version}"
    implementation "maven.modrinth:naturalist:${naturalist_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
